version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    ECR_REPO: lab2-frontend        
    CONTAINER_NAME: app            

phases:
  pre_build:
    commands:
      - set -euo pipefail
      - echo "Logging in to Amazon ECR..."
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - REPO_NAME="${ECR_REPO:-$IMAGE_REPO_NAME}"          
      - REPOSITORY_URI="${REGISTRY}/${REPO_NAME}"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      - COMMIT_HASH=$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-}" | cut -c 1-7)
      - IMAGE_TAG="${COMMIT_HASH:-latest}"
      - echo "REPOSITORY_URI=${REPOSITORY_URI}"; echo "IMAGE_TAG=${IMAGE_TAG}"
      - printf 'REPOSITORY_URI=%s\nIMAGE_TAG=%s\nCONTAINER_NAME=%s\n' "$REPOSITORY_URI" "$IMAGE_TAG" "${CONTAINER_NAME:-app}" > pipeline.env

  build:
    commands:
      - set -euo pipefail
      - . ./pipeline.env
      - echo "Build started on $(date)"
      - echo "Building the Docker image..."
      - docker build --no-cache -t "$REPOSITORY_URI:latest" .
      - docker tag "$REPOSITORY_URI:latest" "$REPOSITORY_URI:$IMAGE_TAG"

  post_build:
    commands:
      - set -euo pipefail
      - . ./pipeline.env
      - echo "Build completed on $(date)"
      - echo "Pushing the Docker images..."
      - docker push "$REPOSITORY_URI:latest"
      - docker push "$REPOSITORY_URI:$IMAGE_TAG"
      - echo "Writing image definitions file..."
      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
